{% extends "base.html" %}

{% block title %}Profile - {{ name }}{% endblock %}

{% block content %}
<section class="hero" id="profile">
    <div class="container hero-grid">
        <div class="hero-identity">
            <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
            <h1>{{ name }}</h1>
        </div>
        <div class="hero-photo">
            <div class="photo-block"></div>
            <img class="avatar" src="/static/img/Me foto.jpg" alt="Photo of {{ name }}">
        </div>
        <div class="hero-details">
            <p class="bio">{{ bio }}</p>
            <dl class="meta-list">
                <div class="meta-row">
                    <dt>NPM</dt>
                    <dd>{{ npm }}</dd>
                </div>
                <div class="meta-row">
                    <dt>Program</dt>
                    <dd>{{ study_program }}</dd>
                </div>
            </dl>
            <div class="social-links">
                <a href="https://github.com/Ranario13" class="social-link">GitHub</a>
                <a href="https://www.linkedin.com/in/ranu-ario-sulistianto-596606380/" class="social-link">LinkedIn</a>
                <a href="mailto:ranu.ario@ui.ac.id" class="social-link">Email</a>
            </div>
        </div>
    </div>
</section>

{% endblock content %}
