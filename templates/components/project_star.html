<form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
            id="star-btn-{{ project.id }}"
            title="{% if project.starred_by.all %}Dibintangi oleh {{ project.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        <span class="star-text">{% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %}</span>
        <span class="star-count" id="star-count-{{ project.id }}">{{ project.starred_by.count }}</span>
    </button>
</form>

<script>
if (!window.starFormHandlerInitialized) {
    window.starFormHandlerInitialized = true;
    document.addEventListener('submit', async function(e) {
        if (!e.target.classList.contains('star-form')) return;
        
        e.preventDefault();
        const form = e.target;
        const url = form.action;
        const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;
        const btn = form.querySelector('button');
        const starText = form.querySelector('.star-text');
        const starCount = form.querySelector('.star-count');

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest',
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const data = await response.json();
                if (data.is_starred) {
                    btn.classList.add('is-starred');
                    starText.textContent = 'Unstar';
                } else {
                    btn.classList.remove('is-starred');
                    starText.textContent = 'Star';
                }
                starCount.textContent = data.star_count;
            } else if (response.status === 403 || response.status === 401) {
                window.location.href = "{% url 'main:login' %}";
            }
        } catch (err) {
            form.submit();
        }
    });
}
</script>
